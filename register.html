<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — vibeVYBE Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <a href="index.html" class="auth-logo">
        vibe<span>VYBE</span>
    </a>

    <div class="auth-box">

        <span class="eyebrow">СОЗДАЙ СВОЙ МИР</span>

        <h1>Регистрация</h1>

        <p>
            Собирай музыку, создавай плейлисты и сохраняй настроение.
        </p>

        <form id="registerForm">

            <label>Имя</label>

            <input
                type="text"
                id="registerName"
                placeholder="Как тебя зовут?"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="registerEmail"
                placeholder="you@example.com"
                required
            >

            <label>Пароль</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Минимум 6 символов"
                required
            >

            <button class="neon-button full-button" type="submit">
                Создать аккаунт
            </button>

        </form>

        <div class="auth-bottom">
            Уже есть аккаунт?
            <a href="login.html">Войти</a>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
