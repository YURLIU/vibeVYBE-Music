<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — vibeVYBE Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <a href="index.html" class="auth-logo">
        vibe<span>VYBE</span>
    </a>

    <div class="auth-box">

        <span class="eyebrow">СНОВА ЗДЕСЬ?</span>

        <h1>Войти</h1>

        <p>
            Продолжи слушать свою музыку.
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="you@example.com"
                required
            >

            <label>Пароль</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="••••••••"
                required
            >

            <button class="neon-button full-button" type="submit">
                Войти
            </button>

        </form>

        <div class="auth-bottom">
            Нет аккаунта?
            <a href="register.html">Создать</a>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
