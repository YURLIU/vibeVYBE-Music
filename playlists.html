<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлисты — vibeVYBE Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <header class="header">

        <a href="home.html" class="logo">
            vibe<span>VYBE</span>
        </a>

        <nav>
            <a href="home.html">Главная</a>
            <a href="music.html">Музыка</a>
            <a href="playlists.html" class="active">Плейлисты</a>
            <a href="profile.html">Мой профиль</a>
        </nav>

        <a href="login.html" class="header-login" id="headerLogin">
            Войти
        </a>

    </header>

    <main class="page">

        <section class="page-heading">

            <div>
                <span class="eyebrow">ТВОЯ МУЗЫКА</span>

                <h1>
                    Мои <span>плейлисты.</span>
                </h1>

                <p>
                    Собирай музыку под настроение, день или просто под себя.
                </p>
            </div>

            <button class="neon-button" id="createPlaylistButton">
                ＋ Создать плейлист
            </button>

        </section>

        <section>

            <div id="playlistsGrid" class="playlist-grid"></div>

        </section>

    </main>

    <div class="modal" id="createPlaylistModal">

        <div class="modal-box">

            <button class="modal-close" id="closeCreateModal">
                ×
            </button>

            <span class="eyebrow">НОВЫЙ ПЛЕЙЛИСТ</span>

            <h2>Создать плейлист</h2>

            <label>
                Название
            </label>

            <input
                type="text"
                id="playlistName"
                placeholder="Например: Ночное настроение"
            >

            <label>
                Обложка
            </label>

            <input
                type="file"
                id="playlistCover"
                accept="image/*"
            >

            <div id="coverPreview" class="cover-preview"></div>

            <button id="savePlaylistButton" class="neon-button full-button">
                Создать
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
